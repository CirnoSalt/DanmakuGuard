# 违禁词词典 - 命中后直接举报，不送 AI，节约 API 开销
#
# 免责声明：默认词典列表为来自网络收集的常见违规弹幕，仅供参考，
#           其内容不代表本项目维护者立场，请根据需求自行编辑。
#
# 匹配模式（每条词条独立，默认按字符类型自动选择）：
#   - 纯 ASCII 字母数字词条（如 SB、OP、fuck）：词边界匹配，前后不能是字母数字
#       避免 OP 误命中 OPPO、SB 误命中 USB 等问题
#   - 含中文或其他字符的词条：子串包含匹配（中文无词边界概念）
# reason 映射到 B站举报理由代码：
#   1 违法违禁  2 色情低俗  3 非法交易  4 人身攻击
#   5 侵犯隐私  6 垃圾广告  7 引战      8 剧透
#   9 恶意刷屏  10 视频无关 11 其他     12 青少年不良
# 说明：已移除纯感叹类词汇（如牛逼、卧槽、我操等），保留真正的人身攻击/辱骂/引战词
#
# 高级用法：如需为单条词条强制指定匹配模式，可使用对象形式：
#   words:
#     - word: 井盖
#       mode: word    # 强制词边界（前后不能是字母数字）
#     - word: OP
#       mode: exact   # 强制完全匹配（整条弹幕等于该词才算命中）
# mode 可选值：contains（子串）/ word（词边界）/ exact（完全匹配）

