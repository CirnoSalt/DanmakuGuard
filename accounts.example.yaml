# B站账号列表 - 多账号轮换，触发风控自动切换下一个账号
# 复制本文件为 accounts.yaml 并填写真实 Cookie
#
# 获取 Cookie 方法：
#   1. 浏览器登录 b站（建议使用小号）
#   2. F12 打开开发者工具 → Application/存储 → Cookies → bilibili.com
#   3. 复制 SESSDATA 和 bili_jct 两个值填到下方
#
# 至少配置 1 个账号；多账号时触发风控会自动切换，所有账号都风控则等待循环
accounts:
  - name: 账号1
    sessdata: "你的SESSDATA"
    bili_jct: "你的bili_jct"
  # - name: 账号2
  #   sessdata: "你的第二个账号的SESSDATA"
  #   bili_jct: "你的第二个账号的bili_jct"
